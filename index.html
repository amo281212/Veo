<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101114;
  color: white;
}

header {
  padding: 25px 20px;
  background: #181a1f;
  border-bottom: 1px solid #292c33;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 6px 0 0;
  color: #999;
}

main {
  padding: 20px;
  max-width: 800px;
  margin: auto;
}

.channel {
  background: #191b20;
  border: 1px solid #292c33;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
  cursor: pointer;
}

.channel-content {
  display: flex;
  align-items: center;
  gap: 14px;
}

.channel-logo {
  width: 52px;
  height: 52px;
  object-fit: contain;
  flex-shrink: 0;
  border-radius: 12px;
}

.channel-name {
  font-size: 19px;
  font-weight: bold;
}

.channel-id {
  color: #888;
  font-size: 13px;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: white;
  color: #111;
  font-size: 16px;
  cursor: pointer;
}

.add-channel {
  margin-top: 4px;
}

.delete-channel {
  margin-top: 10px;
  background: #292c33;
  color: white;
}

.update-epg {
  margin-top: 10px;
  background: #292c33;
  color: white;
}

#editor {
  display: none;
}

.back {
  background: #292c33;
  color: white;
  margin-bottom: 20px;
}

.channel-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 20px;
  text-align: center;
}

.channel-header .channel-logo {
  width: 72px;
  height: 72px;
  margin-bottom: 10px;
}

.channel-header h2 {
  margin: 0;
}

.edit-channel {
  width: auto;
  padding: 8px 14px;
  margin-top: 10px;
  background: #292c33;
  color: white;
  font-size: 13px;
}

.section {
  background: #191b20;
  border: 1px solid #292c33;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
}

.section h2 {
  margin-top: 0;
  font-size: 18px;
}

.day {
  border-bottom: 1px solid #292c33;
}

.day:last-child {
  border-bottom: 0;
}

.day-title {
  width: 100%;
  padding: 16px 4px;
  background: transparent;
  color: white;
  text-align: left;
  font-size: 16px;
  font-weight: bold;
  border-radius: 0;
  position: relative;
}

.day-title::after {
  content: "›";
  position: absolute;
  right: 5px;
  font-size: 22px;
  color: #888;
  transform: rotate(0deg);
  transition: transform 0.2s;
}

.day.open .day-title::after {
  transform: rotate(90deg);
}

.day-content {
  display: none;
  padding-bottom: 8px;
}

.day.open .day-content {
  display: block;
}

.program {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #292c33;
}

.program:last-of-type {
  border-bottom: 0;
}

.time {
  color: #aaa;
  width: 120px;
  flex-shrink: 0;
}

.program-name {
  flex: 1;
}

.edit {
  width: auto;
  padding: 8px 12px;
  background: #292c33;
  color: white;
  font-size: 13px;
}

.add {
  margin-top: 15px;
}

.xml-button {
  margin-top: 10px;
  background: #292c33;
  color: white;
}

.program-editor {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.program-editor-box {
  width: 100%;
  max-width: 500px;
  background: #191b20;
  border: 1px solid #292c33;
  border-radius: 16px;
  padding: 22px;
}

.program-editor-box h2 {
  margin: 0 0 22px;
  font-size: 21px;
}

.program-editor-box label {
  display: block;
  margin-bottom: 7px;
  color: #aaa;
  font-size: 14px;
}

.program-editor-box input {
  width: 100%;
  padding: 13px;
  margin-bottom: 17px;
  border: 1px solid #353941;
  border-radius: 9px;
  background: #101114;
  color: white;
  font-size: 16px;
  outline: none;
}

.program-editor-box input:focus {
  border-color: #666;
}

.editor-buttons {
  display: flex;
  gap: 10px;
  margin-top: 5px;
}

.editor-buttons button {
  flex: 1;
}

.cancel-editor {
  background: #292c33;
  color: white;
}

.save-editor {
  background: white;
  color: #111;
}

.delete-channel-list {
  max-height: 55vh;
  overflow-y: auto;
  margin-bottom: 18px;
}

.delete-channel-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  margin-bottom: 8px;
  background: #101114;
  border: 1px solid #292c33;
  border-radius: 11px;
  cursor: pointer;
}

.delete-channel-option:hover {
  border-color: #555;
}

.delete-channel-option input {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  margin: 0;
  accent-color: white;
}

.delete-channel-option img {
  width: 42px;
  height: 42px;
  object-fit: contain;
  flex-shrink: 0;
}

.delete-channel-info {
  min-width: 0;
}

.delete-channel-name {
  font-size: 16px;
  font-weight: bold;
}

.delete-channel-id {
  color: #888;
  font-size: 12px;
  margin-top: 4px;
}

.delete-confirm {
  background: #292c33;
  color: white;
}

.epg-status {
  color: #aaa;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 18px;
}

.epg-token-input {
  margin-bottom: 10px !important;
}

.epg-token-note {
  color: #777;
  font-size: 12px;
  line-height: 1.4;
  margin: -5px 0 18px;
}

.epg-progress {
  display: none;
  text-align: center;
  color: #aaa;
  font-size: 14px;
  margin-top: 15px;
}
</style>
</head>

<body>

<header>
  <h1>Veo</h1>
  <p>Editor de programación televisiva</p>
</header>

<main id="channels">

  <button class="add-channel" onclick="agregarCanal()">
    ＋ Agregar canal
  </button>

  <button class="delete-channel" onclick="eliminarCanal()">
    Eliminar canal
  </button>

  <button class="update-epg" onclick="actualizarEPG()">
    Actualizar EPG
  </button>

</main>

<main id="editor">

  <button class="back" onclick="goBack()">
    ← Volver a canales
  </button>

  <div class="channel-header">

    <img id="channelLogo" class="channel-logo" src="" alt="">

    <h2 id="channelTitle"></h2>

    <button class="edit-channel" onclick="editarCanal()">
      Editar canal
    </button>

  </div>

  <div class="section">

    <h2>📋 Programación</h2>

    <div id="week"></div>

  </div>

</main>

<script>

const dias = [
  "Lunes",
  "Martes",
  "Miércoles",
  "Jueves",
  "Viernes",
  "Sábado",
  "Domingo"
];

const canalesBase = [

  {
    clave: "TVN.cl",
    nombre: "TVN",
    id: "TVN.cl",
    logo: "https://raw.githubusercontent.com/amo281212/logos-iptv/refs/heads/main/TVN.png"
  },

  {
    clave: "Mega.cl",
    nombre: "Mega",
    id: "Mega.cl",
    logo: "https://cdn.m3u.cl/logo/455_Mega.png"
  },

  {
    clave: "Chilevision.cl",
    nombre: "Chilevisión",
    id: "Chilevision.cl",
    logo: "https://cdn.m3u.cl/logo/1569_CHV.png"
  },

  {
    clave: "Canal13.cl",
    nombre: "Canal 13",
    id: "Canal13.cl",
    logo: "https://cdn.m3u.cl/logo/1733_Canal_13.png"
  }

];

let canalActual = "";
let canalActualClave = "";
let diaActual = "";

function obtenerDiaActual() {

  const dia = new Date().getDay();

  const conversion = {
    0: "Domingo",
    1: "Lunes",
    2: "Martes",
    3: "Miércoles",
    4: "Jueves",
    5: "Viernes",
    6: "Sábado"
  };

  return conversion[dia];
}

function datosIniciales() {

  const datos = {};

  dias.forEach(dia => {
    datos[dia] = [];
  });

  return datos;
}

/* =====================================================
   CANALES
===================================================== */

function obtenerCanales() {

  const eliminados = JSON.parse(
    localStorage.getItem(
      "veo_canales_eliminados"
    ) || "[]"
  );

  const canales = canalesBase
    .filter(
      canal =>
        !eliminados.includes(
          canal.clave
        )
    )
    .map(canal => ({
      ...canal
    }));

  const ediciones = JSON.parse(
    localStorage.getItem(
      "veo_ediciones_canales"
    ) || "[]"
  );

  ediciones.forEach(edicion => {

    const canal = canales.find(
      item =>
        item.clave ===
        edicion.clave
    );

    if (canal) {

      canal.nombre =
        edicion.nombre;

      canal.id =
        edicion.id;

      canal.logo =
        edicion.logo;

    }

  });

  const guardados = JSON.parse(
    localStorage.getItem(
      "veo_canales"
    ) || "[]"
  );

  guardados.forEach(canalGuardado => {

    const clave =
      canalGuardado.clave ||
      canalGuardado.id;

    const existente =
      canales.find(
        item =>
          item.clave ===
          clave
      );

    if (!existente) {

      canales.push({

        clave:
          clave,

        nombre:
          canalGuardado.nombre,

        id:
          canalGuardado.id,

        logo:
          canalGuardado.logo

      });

    }

  });

  return canales;
}

function obtenerCanalPorClave(clave) {

  const canales =
    obtenerCanales();

  return canales.find(
    canal =>
      canal.clave ===
      clave
  );
}

function crearTarjetaCanal(
  nombre,
  id,
  logo,
  clave
) {

  const channels =
    document.getElementById(
      "channels"
    );

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "channel";

  card.dataset.channelKey =
    clave;

  const content =
    document.createElement(
      "div"
    );

  content.className =
    "channel-content";

  content.innerHTML = `

    <img
      class="channel-logo"
      src="${logo}"
      alt="${nombre}"
    >

    <div>

      <div class="channel-name">
        ${nombre}
      </div>

      <div class="channel-id">
        ${id}
      </div>

    </div>

  `;

  card.appendChild(
    content
  );

  card.onclick =
    function() {

      openChannelByKey(
        clave
      );

    };

  channels.insertBefore(
    card,
    channels.querySelector(
      ".add-channel"
    )
  );
}

function renderizarCanales() {

  const channels =
    document.getElementById(
      "channels"
    );

  channels
    .querySelectorAll(
      ".channel"
    )
    .forEach(card => {

      card.remove();

    });

  const canales =
    obtenerCanales();

  canales.forEach(canal => {

    crearTarjetaCanal(
      canal.nombre,
      canal.id,
      canal.logo,
      canal.clave
    );

  });

}

function openChannelByKey(clave) {

  const canal =
    obtenerCanalPorClave(
      clave
    );

  if (!canal) {
    return;
  }

  document.getElementById(
    "channels"
  ).style.display =
    "none";

  document.getElementById(
    "editor"
  ).style.display =
    "block";

  canalActual =
    canal.id;

  canalActualClave =
    canal.clave;

  document.getElementById(
    "channelTitle"
  ).textContent =
    canal.nombre;

  document.getElementById(
    "channelLogo"
  ).src =
    canal.logo;

  document.getElementById(
    "channelLogo"
  ).alt =
    canal.nombre;

  cargarProgramacion(
    canal
  );
}

function goBack() {

  document.getElementById(
    "editor"
  ).style.display =
    "none";

  document.getElementById(
    "channels"
  ).style.display =
    "block";

  renderizarCanales();
}

/* =====================================================
   AGREGAR CANAL
===================================================== */

function agregarCanal() {

  const editor =
    document.createElement(
      "div"
    );

  editor.className =
    "program-editor";

  editor.innerHTML = `

    <div class="program-editor-box">

      <h2>Agregar canal</h2>

      <label>Nombre del canal</label>

      <input
        class="editor-nombre"
        type="text"
      >

      <label>ID del canal</label>

      <input
        class="editor-id"
        type="text"
      >

      <label>URL del logo</label>

      <input
        class="editor-logo"
        type="text"
      >

      <div class="editor-buttons">

        <button class="cancel-editor">
          Cancelar
        </button>

        <button class="save-editor">
          Guardar
        </button>

      </div>

    </div>

  `;

  document.body.appendChild(
    editor
  );

  editor.querySelector(
    ".cancel-editor"
  ).onclick =
    function() {

      editor.remove();

    };

  editor.querySelector(
    ".save-editor"
  ).onclick =
    function() {

      const nombre =
        editor.querySelector(
          ".editor-nombre"
        ).value.trim();

      const id =
        editor.querySelector(
          ".editor-id"
        ).value.trim();

      const logo =
        editor.querySelector(
          ".editor-logo"
        ).value.trim();

      if (
        !nombre ||
        !id ||
        !logo
      ) {

        alert(
          "Completa todos los campos."
        );

        return;
      }

      const canales =
        JSON.parse(
          localStorage.getItem(
            "veo_canales"
          ) || "[]"
        );

      canales.push({

        clave:
          id,

        nombre:
          nombre,

        id:
          id,

        logo:
          logo

      });

      localStorage.setItem(
        "veo_canales",
        JSON.stringify(
          canales
        )
      );

      renderizarCanales();

      editor.remove();

    };

}

/* =====================================================
   EDITAR CANAL
===================================================== */

function editarCanal() {

  const canal =
    obtenerCanalPorClave(
      canalActualClave
    );

  if (!canal) {
    return;
  }

  const editor =
    document.createElement(
      "div"
    );

  editor.className =
    "program-editor";

  editor.innerHTML = `

    <div class="program-editor-box">

      <h2>Editar canal</h2>

      <label>Nombre del canal</label>

      <input
        class="editor-nombre"
        type="text"
      >

      <label>ID del canal</label>

      <input
        class="editor-id"
        type="text"
      >

      <label>URL del logo</label>

      <input
        class="editor-logo"
        type="text"
      >

      <div class="editor-buttons">

        <button class="cancel-editor">
          Cancelar
        </button>

        <button class="save-editor">
          Guardar
        </button>

      </div>

    </div>

  `;

  document.body.appendChild(
    editor
  );

  editor.querySelector(
    ".editor-nombre"
  ).value =
    canal.nombre;

  editor.querySelector(
    ".editor-id"
  ).value =
    canal.id;

  editor.querySelector(
    ".editor-logo"
  ).value =
    canal.logo;

  editor.querySelector(
    ".cancel-editor"
  ).onclick =
    function() {

      editor.remove();

    };

  editor.querySelector(
    ".save-editor"
  ).onclick =
    function() {

      const nuevoNombre =
        editor.querySelector(
          ".editor-nombre"
        ).value.trim();

      const nuevoId =
        editor.querySelector(
          ".editor-id"
        ).value.trim();

      const nuevoLogo =
        editor.querySelector(
          ".editor-logo"
        ).value.trim();

      if (
        !nuevoNombre ||
        !nuevoId ||
        !nuevoLogo
      ) {

        alert(
          "Completa todos los campos."
        );

        return;
      }

      const idAnterior =
        canal.id;

      if (
        idAnterior !==
        nuevoId
      ) {

        const programacionAnterior =
          localStorage.getItem(
            "veo_programacion_v3_" +
            idAnterior
          );

        if (programacionAnterior) {

          localStorage.setItem(
            "veo_programacion_v3_" +
            nuevoId,
            programacionAnterior
          );

          localStorage.removeItem(
            "veo_programacion_v3_" +
            idAnterior
          );

        }

      }

      const canales =
        JSON.parse(
          localStorage.getItem(
            "veo_canales"
          ) || "[]"
        );

      const canalGuardado =
        canales.find(
          item =>
            (item.clave ||
              item.id) ===
            canalActualClave
        );

      if (canalGuardado) {

        canalGuardado.nombre =
          nuevoNombre;

        canalGuardado.id =
          nuevoId;

        canalGuardado.logo =
          nuevoLogo;

        localStorage.setItem(
          "veo_canales",
          JSON.stringify(
            canales
          )
        );

      } else {

        const ediciones =
          JSON.parse(
            localStorage.getItem(
              "veo_ediciones_canales"
            ) || "[]"
          );

        const edicionExistente =
          ediciones.find(
            item =>
              item.clave ===
              canalActualClave
          );

        if (
          edicionExistente
        ) {

          edicionExistente.nombre =
            nuevoNombre;

          edicionExistente.id =
            nuevoId;

          edicionExistente.logo =
            nuevoLogo;

        } else {

          ediciones.push({

            clave:
              canalActualClave,

            nombre:
              nuevoNombre,

            id:
              nuevoId,

            logo:
              nuevoLogo

          });

        }

        localStorage.setItem(
          "veo_ediciones_canales",
          JSON.stringify(
            ediciones
          )
        );

      }

      canalActual =
        nuevoId;

      document.getElementById(
        "channelTitle"
      ).textContent =
        nuevoNombre;

      document.getElementById(
        "channelLogo"
      ).src =
        nuevoLogo;

      document.getElementById(
        "channelLogo"
      ).alt =
        nuevoNombre;

      renderizarCanales();

      editor.remove();

      cargarProgramacion({

        clave:
          canalActualClave,

        nombre:
          nuevoNombre,

        id:
          nuevoId,

        logo:
          nuevoLogo

      });

    };

}

/* =====================================================
   ELIMINAR CANAL
===================================================== */

function eliminarCanal() {

  const canales =
    obtenerCanales();

  if (!canales.length) {

    alert(
      "No hay canales para eliminar."
    );

    return;
  }

  const editor =
    document.createElement(
      "div"
    );

  editor.className =
    "program-editor";

  let opciones = "";

  canales.forEach(
    canal => {

      opciones += `

        <label class="delete-channel-option">

          <input
            type="radio"
            name="canalEliminar"
            value="${escapeHTMLAttribute(
              canal.clave
            )}"
          >

          <img
            src="${escapeHTMLAttribute(
              canal.logo
            )}"
            alt=""
          >

          <div class="delete-channel-info">

            <div class="delete-channel-name">
              ${escapeHTML(
                canal.nombre
              )}
            </div>

            <div class="delete-channel-id">
              ${escapeHTML(
                canal.id
              )}
            </div>

          </div>

        </label>

      `;

    }
  );

  editor.innerHTML = `

    <div class="program-editor-box">

      <h2>Eliminar canal</h2>

      <div class="delete-channel-list">

        ${opciones}

      </div>

      <div class="editor-buttons">

        <button class="cancel-editor">
          Cancelar
        </button>

        <button class="delete-confirm">
          Eliminar
        </button>

      </div>

    </div>

  `;

  document.body.appendChild(
    editor
  );

  editor.querySelector(
    ".cancel-editor"
  ).onclick =
    function() {

      editor.remove();

    };

  editor.querySelector(
    ".delete-confirm"
  ).onclick =
    function() {

      const seleccion =
        editor.querySelector(
          'input[name="canalEliminar"]:checked'
        );

      if (!seleccion) {

        alert(
          "Selecciona un canal."
        );

        return;
      }

      const clave =
        seleccion.value;

      const canal =
        obtenerCanalPorClave(
          clave
        );

      if (!canal) {

        editor.remove();

        return;
      }

      const confirmar =
        confirm(
          '¿Eliminar el canal "' +
          canal.nombre +
          '"?'
        );

      if (!confirmar) {
        return;
      }

      eliminarCanalPorClave(
        canal
      );

      editor.remove();

      renderizarCanales();

    };

}

function eliminarCanalPorClave(
  canal
) {

  localStorage.removeItem(
    "veo_programacion_v3_" +
    canal.id
  );

  if (
    canal.clave ===
    "TVN.cl"
  ) {

    localStorage.removeItem(
      "veo_programacion_v3_TVN"
    );

  }

  const canales =
    JSON.parse(
      localStorage.getItem(
        "veo_canales"
      ) || "[]"
    );

  const nuevosCanales =
    canales.filter(
      item =>
        (item.clave ||
          item.id) !==
        canal.clave
    );

  localStorage.setItem(
    "veo_canales",
    JSON.stringify(
      nuevosCanales
    )
  );

  const esBase =
    canalesBase.some(
      item =>
        item.clave ===
        canal.clave
    );

  if (esBase) {

    const eliminados =
      JSON.parse(
        localStorage.getItem(
          "veo_canales_eliminados"
        ) || "[]"
      );

    if (
      !eliminados.includes(
        canal.clave
      )
    ) {

      eliminados.push(
        canal.clave
      );

    }

    localStorage.setItem(
      "veo_canales_eliminados",
      JSON.stringify(
        eliminados
      )
    );

    const ediciones =
      JSON.parse(
        localStorage.getItem(
          "veo_ediciones_canales"
        ) || "[]"
      );

    const nuevasEdiciones =
      ediciones.filter(
        item =>
          item.clave !==
          canal.clave
      );

    localStorage.setItem(
      "veo_ediciones_canales",
      JSON.stringify(
        nuevasEdiciones
      )
    );

  }

  if (
    canalActualClave ===
    canal.clave
  ) {

    canalActual = "";
    canalActualClave = "";

    document.getElementById(
      "editor"
    ).style.display =
      "none";

    document.getElementById(
      "channels"
    ).style.display =
      "block";

  }

}

function guardarProgramacion() {

  const diasDOM =
    document.querySelectorAll(
      ".day"
    );

  if (!diasDOM.length) {
    return;
  }

  const datos = {};

  diasDOM.forEach(
    dia => {

      const nombreDia =
        dia.dataset.day;

      datos[nombreDia] = [];

      dia.querySelectorAll(
        ".program"
      ).forEach(
        programa => {

          datos[nombreDia].push({

            nombre:
              programa.querySelector(
                ".program-name"
              ).textContent,

            inicio:
              programa.dataset.start,

            fin:
              programa.dataset.end

          });

        }
      );

    }
  );

  if (!canalActual) {
    return;
  }

  localStorage.setItem(
    "veo_programacion_v3_" +
    canalActual,
    JSON.stringify(
      datos
    )
  );
}

function renderizarSemana(

  const contenedor =

  dias.forEach(
    dia => {

      const bloque =
        document.createElement(
          "div"
        );

      bloque.className =
        "day";

      bloque.dataset.day =
        dia;

      if (
        dia ===
        diaActual
      ) {

        bloque.classList.add(
          "open"
        );

      }

      const boton =
        document.createElement(
          "button"
        );

      boton.className =
        "day-title";

      boton.textContent =

      boton.onclick =

          toggleDay(

        };

      const contenido =
        document.createElement(
          "div"
        );

      contenido.className =

function toggleDay(
  boton
) {

  const dia =
    boton.parentElement;

  document.querySelectorAll(
    ".day"

    otro => {

      if (
        otro !==
        dia
      ) {

        otro.classList.remove(
          "open"
        );

      }

    }
  );

  dia.classList.toggle(
    "open"
  );

  if (
    dia.classList.contains(
      "open"
    )
  ) {

    diaActual =
      dia.dataset.day;

  }

function escaparXML(
  texto
) {

  return String(
    texto
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&apos;"
    );

}

function escapeHTML(
  texto
) {

  return String(
    texto
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

function escapeHTMLAttribute(
  texto
) {

  return escapeHTML(
    texto
  );

}

function obtenerProgramacionCanalPorId(
  canal
) {

  const guardada =
    localStorage.getItem(
      "veo_programacion_v3_" +
      canal.id
    );

  if (guardada) {

    return JSON.parse(
      guardada
    );

  }

  if (
    canal.clave ===
    "TVN.cl"
  ) {

    const antigua =
      localStorage.getItem(
        "veo_programacion_v3_TVN"
      );

    if (antigua) {

      return JSON.parse(
        antigua
      );

    }

  }

  return datosIniciales();
}

function formatoFechaXML(
  fecha
) {

  const año =
    fecha.getFullYear();

  const mes =
    String(
      fecha.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const dia =
    String(
      fecha.getDate()
    ).padStart(
      2,
      "0"
    );

  const horas =
    String(
      fecha.getHours()
    ).padStart(
      2,
      "0"
    );

  const minutos =
    String(
      fecha.getMinutes()
    ).padStart(
      2,
      "0"
    );

  const offset =
    -fecha.getTimezoneOffset();

  const signo =
    offset >= 0
      ? "+"
      : "-";

  const offsetAbs =
    Math.abs(
      offset
    );

  const offsetHoras =
    String(
      Math.floor(
        offsetAbs / 60
      )
    ).padStart(
      2,
      "0"
    );

  const offsetMinutos =
    String(
      offsetAbs % 60
    ).padStart(
      2,
      "0"
    );

  return (
    año +
    mes +
    dia +
    horas +
    minutos +
    "00 " +
    signo +
    offsetHoras +
    offsetMinutos
  );

}

function crearFechaPrograma(
  fechaBase,
  hora
) {

  const partes =
    hora.split(":");

  const horas =
    parseInt(
      partes[0],
      10
    );

  const minutos =
    parseInt(
      partes[1],
      10
    );

  const fecha =
    new Date(
      fechaBase
    );

  fecha.setHours(
    horas
  );

  fecha.setMinutes(
    minutos
  );

  fecha.setSeconds(
    0
  );

  fecha.setMilliseconds(
    0
  );

  return fecha;
}

/*
  Genera el XMLTV y lo devuelve
  como texto. Ya no lo descarga.
*/

function generarXMLTV() {

  /*
    IMPORTANTE:
    No llamamos a guardarProgramacion()
    aquí porque al actualizar el EPG
    estamos en la pantalla principal y
    no existen los días .day en el DOM.
    Hacerlo aquí borraría la programación
    guardada.
  */

  const canales =
    obtenerCanales();

  let xml = "";

  xml +=
    '<?xml version="1.0" encoding="UTF-8"?>\n';

  xml +=
    '<tv generator-info-name="Veo" generator-info-url="https://amo281212.github.io/Veo/">\n';

  /* CANALES */

  canales.forEach(
    canal => {

      xml +=
        '  <channel id="' +
        escaparXML(
          canal.id
        ) +
        '">\n';

      xml +=
        '    <display-name>' +
        escaparXML(
          canal.nombre
        ) +
        '</display-name>\n';

      if (canal.logo) {

        xml +=
          '    <icon src="' +
          escaparXML(
            canal.logo
          ) +
          '"/>\n';

      }

      xml +=
        '  </channel>\n';

    }
  );

  /* PROGRAMACIÓN */

  const fechaInicio =
    new Date();

  fechaInicio.setHours(
    0
  );

  fechaInicio.setMinutes(
    0
  );

  fechaInicio.setSeconds(
    0
  );

  fechaInicio.setMilliseconds(
    0
  );

  for (
    let i = 0;
    i < 14;
    i++
  ) {

    const fecha =
      new Date(
        fechaInicio
      );

    fecha.setDate(
      fechaInicio.getDate() +
      i
    );

    const diaSemana =
      dias[
        (fecha.getDay() + 6) %
        7
      ];

    canales.forEach(
      canal => {

        const datos =
          obtenerProgramacionCanalPorId(
            canal
          );

        const programas =
          datos[
            diaSemana
          ] || [];

        programas.forEach(
          programa => {

            const inicio =
              crearFechaPrograma(
                fecha,
                programa.inicio
              );

            const fin =
              crearFechaPrograma(
                fecha,
                programa.fin
              );

            if (
              fin <= inicio
            ) {

              fin.setDate(
                fin.getDate() +
                1
              );

            }

            xml +=
              '  <programme channel="' +
              escaparXML(
                canal.id
              ) +
              '" start="' +
              formatoFechaXML(
                inicio
              ) +
              '" stop="' +
              formatoFechaXML(
                fin
              ) +
              '">\n';

            xml +=
              '    <title lang="es">' +
              escaparXML(
                programa.nombre
              ) +
              '</title>\n';

            xml +=
              '  </programme>\n';

          }
        );

      }
    );

  }

  xml +=
    "</tv>";

  return xml;
}

async function obtenerTokenParaGitHub() {

}

async function obtenerSHAArchivo(
  token
) {

  const respuesta =
    await fetch(
      "https://api.github.com/repos/" +
      GITHUB_OWNER +
      "/" +
      GITHUB_REPO +
      "/contents/" +
      GITHUB_FILE +
      "?ref=" +
      GITHUB_BRANCH,
      {
        method:
          "GET",

        headers: {
          "Accept":
            "application/vnd.github+json",

          "Authorization":
            "Bearer " +
            token,

          "X-GitHub-Api-Version":
            "2026-03-10"
        }
      }
    );

  if (
    respuesta.status ===
    404
  ) {

    return null;

  }

  if (
    !respuesta.ok
  ) {

    const texto =
      await respuesta.text();

    throw new Error(
      "GitHub respondió " +
      respuesta.status +
      ": " +
      texto
    );

  }

  const datos =
    await respuesta.json();

  return datos.sha;
}

function convertirBase64(texto) {

  const bytes =
    new TextEncoder().encode(
      texto
    );

  let binario = "";

  const tamaño =
    0x8000;

  for (
    let i = 0;
    i < bytes.length;
    i += tamaño
  ) {

    const bloque =
      bytes.subarray(
        i,
        i + tamaño
      );

    binario +=
      String.fromCharCode(
        ...bloque
      );

  }

  return btoa(
    binario
  );
}

async function subirEPGaGitHub(
  xml,
  token
) {

  const sha =
    await obtenerSHAArchivo(
      token
    );

  const cuerpo = {

    message:
      "Actualizar EPG desde Veo",

    content:
      convertirBase64(
        xml
      ),

    branch:
      GITHUB_BRANCH

  };

  if (sha) {

    cuerpo.sha =
      sha;

  }

  const respuesta =
    await fetch(
      "https://api.github.com/repos/" +
      GITHUB_OWNER +
      "/" +
      GITHUB_REPO +
      "/contents/" +
      GITHUB_FILE,
      {
        method:
          "PUT",

        headers: {
          "Accept":
            "application/vnd.github+json",

          "Authorization":
            "Bearer " +
            token,

          "X-GitHub-Api-Version":
            "2026-03-10",

          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            cuerpo
          )
      }
    );

  if (
    !respuesta.ok
  ) {

    const texto =
      await respuesta.text();

    throw new Error(
      "GitHub respondió " +
      respuesta.status +
      ": " +
      texto
    );

  }

  return await respuesta.json();
}

/* =====================================================
   ACTUALIZAR EPG
===================================================== */

async function actualizarEPG() {

  const boton =
    document.querySelector(
      ".update-epg"
    );

  const textoOriginal =
    boton.textContent;

  try {

    boton.disabled =
      true;

    boton.textContent =
      "Actualizando...";

    const token =
      await obtenerTokenParaGitHub();

    if (!token) {

      boton.disabled =
        false;

      boton.textContent =
        textoOriginal;

      return;
    }

    boton.textContent =
      "Generando EPG...";

    const xml =
      generarXMLTV();

    boton.textContent =
      "Subiendo a GitHub...";

    await subirEPGaGitHub(
      xml,
      token
    );

    boton.textContent =
      "EPG actualizado";

    setTimeout(
      () => {

        boton.disabled =
          false;

        boton.textContent =
          textoOriginal;

      },
      2500
    );

    alert(
      "EPG actualizado correctamente en GitHub."
    );

  } catch (error) {

    console.error(
      error
    );

    if (
      error.message.includes(
        "401"
      )
    ) {

      localStorage.removeItem(
        "veo_github_token"
      );

    }

    boton.disabled =
      false;

    boton.textContent =
      textoOriginal;

    alert(
      "No se pudo actualizar el EPG.\n\n" +
      error.message
    );

  }

}

   INICIO

renderizarCanales();
