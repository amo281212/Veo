<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101114;
  color: white;
}

header {
  padding: 25px 20px;
  background: #181a1f;
  border-bottom: 1px solid #292c33;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 6px 0 0;
  color: #999;
}

main {
  padding: 20px;
  max-width: 800px;
  margin: auto;
}

.channel {
  background: #191b20;
  border: 1px solid #292c33;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
  cursor: pointer;
}

.channel-content {
  display: flex;
  align-items: center;
  gap: 14px;
}

.channel-logo {
  width: 52px;
  height: 52px;
  object-fit: contain;
  flex-shrink: 0;
  border-radius: 12px;
}

.channel-name {
  font-size: 19px;
  font-weight: bold;
}

.channel-id {
  color: #888;
  font-size: 13px;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: white;
  color: #111;
  font-size: 16px;
  cursor: pointer;
}

#editor {
  display: none;
}

.back {
  background: #292c33;
  color: white;
  margin-bottom: 20px;
}

.channel-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}

.channel-header h2 {
  margin: 0;
}

.section {
  background: #191b20;
  border: 1px solid #292c33;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
}

.section h2 {
  margin-top: 0;
  font-size: 18px;
}

.program {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #292c33;
}

.program:last-child {
  border-bottom: 0;
}

.time {
  color: #aaa;
  width: 120px;
  flex-shrink: 0;
}

.program-name {
  flex: 1;
}

.edit {
  width: auto;
  padding: 8px 12px;
  background: #292c33;
  color: white;
  font-size: 13px;
}

.add {
  margin-top: 15px;
}
</style>
</head>

<body>

<header>
  <h1>Veo</h1>
  <p>Editor de programación televisiva</p>
</header>

<main id="channels">

  <div class="channel" onclick="openChannel('TVN', 'https://raw.githubusercontent.com/amo281212/logos-iptv/refs/heads/main/TVN.png')">
    <div class="channel-content">
      <img class="channel-logo" src="https://raw.githubusercontent.com/amo281212/logos-iptv/refs/heads/main/TVN.png" alt="TVN">
      <div>
        <div class="channel-name">TVN</div>
        <div class="channel-id">TVN.cl</div>
      </div>
    </div>
  </div>

  <div class="channel" onclick="openChannel('Mega', 'https://cdn.m3u.cl/logo/455_Mega.png')">
    <div class="channel-content">
      <img class="channel-logo" src="https://cdn.m3u.cl/logo/455_Mega.png" alt="Mega">
      <div>
        <div class="channel-name">Mega</div>
        <div class="channel-id">Mega.cl</div>
      </div>
    </div>
  </div>

  <div class="channel" onclick="openChannel('Chilevisión', 'https://cdn.m3u.cl/logo/1569_CHV.png')">
    <div class="channel-content">
      <img class="channel-logo" src="https://cdn.m3u.cl/logo/1569_CHV.png" alt="Chilevisión">
      <div>
        <div class="channel-name">Chilevisión</div>
        <div class="channel-id">Chilevision.cl</div>
      </div>
    </div>
  </div>

  <div class="channel" onclick="openChannel('Canal 13', 'https://cdn.m3u.cl/logo/1733_Canal_13.png')">
    <div class="channel-content">
      <img class="channel-logo" src="https://cdn.m3u.cl/logo/1733_Canal_13.png" alt="Canal 13">
      <div>
        <div class="channel-name">Canal 13</div>
        <div class="channel-id">Canal13.cl</div>
      </div>
    </div>
  </div>

  <button>＋ Agregar canal</button>

</main>


<main id="editor">

  <button class="back" onclick="goBack()">← Volver a canales</button>

  <div class="channel-header">
    <img id="channelLogo" class="channel-logo" src="" alt="">
    <h2 id="channelTitle">TVN</h2>
  </div>

  <div class="section">
    <h2>📋 Programación</h2>

    <div class="program">
      <div class="time">06:00 - 09:00</div>
      <div class="program-name">Buenos días</div>
      <button class="edit" onclick="editarPrograma(this)">Editar</button>
    </div>

    <div class="program">
      <div class="time">09:00 - 13:00</div>
      <div class="program-name">Noticias</div>
      <button class="edit" onclick="editarPrograma(this)">Editar</button>
    </div>

    <div class="program">
      <div class="time">13:00 - 14:00</div>
      <div class="program-name">24 Horas</div>
      <button class="edit" onclick="editarPrograma(this)">Editar</button>
    </div>

    <button class="add">＋ Agregar programa</button>
  </div>


  <div class="section">
    <h2>🕐 Horarios</h2>

    <div class="program">
      <div class="program-name">Lunes</div>
      <button class="edit">Editar</button>
    </div>

    <div class="program">
      <div class="program-name">Martes</div>
      <button class="edit">Editar</button>
    </div>

    <div class="program">
      <div class="program-name">Miércoles</div>
      <button class="edit">Editar</button>
    </div>

    <div class="program">
      <div class="program-name">Jueves</div>
      <button class="edit">Editar</button>
    </div>

    <div class="program">
      <div class="program-name">Viernes</div>
      <button class="edit">Editar</button>
    </div>

    <div class="program">
      <div class="program-name">Sábado</div>
      <button class="edit">Editar</button>
    </div>

    <div class="program">
      <div class="program-name">Domingo</div>
      <button class="edit">Editar</button>
    </div>
  </div>

</main>


<script>

function openChannel(channel, logo) {
  document.getElementById("channels").style.display = "none";
  document.getElementById("editor").style.display = "block";

  document.getElementById("channelTitle").textContent = channel;

  document.getElementById("channelLogo").src = logo;
  document.getElementById("channelLogo").alt = channel;
}

function goBack() {
  document.getElementById("editor").style.display = "none";
  document.getElementById("channels").style.display = "block";
}

function editarPrograma(boton) {
  const programa = boton.parentElement;
  const nombre = programa.querySelector(".program-name").textContent;
  const horaInicio = programa.querySelector(".time").textContent;

  const nuevoNombre = prompt("Nombre del programa:", nombre);
  if (nuevoNombre === null) return;

  const nuevaHoraInicio = prompt("Hora de inicio:", horaInicio);
  if (nuevaHoraInicio === null) return;

  const nuevaHoraFin = prompt("Hora de término:", "");
  if (nuevaHoraFin === null) return;

  programa.querySelector(".program-name").textContent = nuevoNombre;
  programa.querySelector(".time").textContent =
    nuevaHoraInicio + " - " + nuevaHoraFin;
}
  
</script>

</body>
</html>
