<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101114;
  color: white;
}

header {
  padding: 25px 20px;
  background: #181a1f;
  border-bottom: 1px solid #292c33;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 6px 0 0;
  color: #999;
}

main {
  padding: 20px;
  max-width: 800px;
  margin: auto;
}

.channel {
  background: #191b20;
  border: 1px solid #292c33;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
  cursor: pointer;
}

.channel-content {
  display: flex;
  align-items: center;
  gap: 14px;
}

.channel-logo {
  width: 52px;
  height: 52px;
  object-fit: contain;
  flex-shrink: 0;
  border-radius: 12px;
}

.channel-name {
  font-size: 19px;
  font-weight: bold;
}

.channel-id {
  color: #888;
  font-size: 13px;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: white;
  color: #111;
  font-size: 16px;
  cursor: pointer;
}

.add-channel {
  margin-top: 4px;
}

.update-epg {
  margin-top: 10px;
  background: #292c33;
  color: white;
}

#editor {
  display: none;
}

.back {
  background: #292c33;
  color: white;
  margin-bottom: 20px;
}

.channel-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 20px;
  text-align: center;
}

.channel-header .channel-logo {
  width: 72px;
  height: 72px;
  margin-bottom: 10px;
}

.channel-header h2 {
  margin: 0;
}

.edit-channel {
  width: auto;
  padding: 8px 14px;
  margin-top: 10px;
  background: #292c33;
  color: white;
  font-size: 13px;
}

.section {
  background: #191b20;
  border: 1px solid #292c33;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
}

.section h2 {
  margin-top: 0;
  font-size: 18px;
}

.day {
  border-bottom: 1px solid #292c33;
}

.day:last-child {
  border-bottom: 0;
}

.day-title {
  width: 100%;
  padding: 16px 4px;
  background: transparent;
  color: white;
  text-align: left;
  font-size: 16px;
  font-weight: bold;
  border-radius: 0;
  position: relative;
}

.day-title::after {
  content: "›";
  position: absolute;
  right: 5px;
  font-size: 22px;
  color: #888;
  transform: rotate(0deg);
  transition: transform 0.2s;
}

.day.open .day-title::after {
  transform: rotate(90deg);
}

.day-content {
  display: none;
  padding-bottom: 8px;
}

.day.open .day-content {
  display: block;
}

.program {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #292c33;
}

.program:last-of-type {
  border-bottom: 0;
}

.time {
  color: #aaa;
  width: 120px;
  flex-shrink: 0;
}

.program-name {
  flex: 1;
}

.edit {
  width: auto;
  padding: 8px 12px;
  background: #292c33;
  color: white;
  font-size: 13px;
}

.add {
  margin-top: 15px;
}

.xml-button {
  margin-top: 10px;
  background: #292c33;
  color: white;
}

/* EDITORES */

.program-editor {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.program-editor-box {
  width: 100%;
  max-width: 500px;
  background: #191b20;
  border: 1px solid #292c33;
  border-radius: 16px;
  padding: 22px;
}

.program-editor-box h2 {
  margin: 0 0 22px;
  font-size: 21px;
}

.program-editor-box label {
  display: block;
  margin-bottom: 7px;
  color: #aaa;
  font-size: 14px;
}

.program-editor-box input {
  width: 100%;
  padding: 13px;
  margin-bottom: 17px;
  border: 1px solid #353941;
  border-radius: 9px;
  background: #101114;
  color: white;
  font-size: 16px;
  outline: none;
}

.program-editor-box input:focus {
  border-color: #666;
}

.editor-buttons {
  display: flex;
  gap: 10px;
  margin-top: 5px;
}

.editor-buttons button {
  flex: 1;
}

.cancel-editor {
  background: #292c33;
  color: white;
}

.save-editor {
  background: white;
  color: #111;
}
</style>
</head>

<body>

<header>
  <h1>Veo</h1>
  <p>Editor de programación televisiva</p>
</header>

<main id="channels">

  <div class="channel" onclick="openChannelByKey('TVN.cl')">
    <div class="channel-content">
      <img
        class="channel-logo"
        src="https://raw.githubusercontent.com/amo281212/logos-iptv/refs/heads/main/TVN.png"
        alt="TVN"
      >

      <div>
        <div class="channel-name">TVN</div>
        <div class="channel-id">TVN.cl</div>
      </div>
    </div>
  </div>


  <div class="channel" onclick="openChannelByKey('Mega.cl')">
    <div class="channel-content">
      <img
        class="channel-logo"
        src="https://cdn.m3u.cl/logo/455_Mega.png"
        alt="Mega"
      >

      <div>
        <div class="channel-name">Mega</div>
        <div class="channel-id">Mega.cl</div>
      </div>
    </div>
  </div>


  <div class="channel" onclick="openChannelByKey('Chilevision.cl')">
    <div class="channel-content">
      <img
        class="channel-logo"
        src="https://cdn.m3u.cl/logo/1569_CHV.png"
        alt="Chilevisión"
      >

      <div>
        <div class="channel-name">Chilevisión</div>
        <div class="channel-id">Chilevision.cl</div>
      </div>
    </div>
  </div>


  <div class="channel" onclick="openChannelByKey('Canal13.cl')">
    <div class="channel-content">
      <img
        class="channel-logo"
        src="https://cdn.m3u.cl/logo/1733_Canal_13.png"
        alt="Canal 13"
      >

      <div>
        <div class="channel-name">Canal 13</div>
        <div class="channel-id">Canal13.cl</div>
      </div>
    </div>
  </div>


  <button class="add-channel" onclick="agregarCanal()">
    ＋ Agregar canal
  </button>


  <button class="update-epg" onclick="actualizarEPG()">
    Actualizar EPG
  </button>

</main>


<main id="editor">

  <button class="back" onclick="goBack()">
    ← Volver a canales
  </button>


  <div class="channel-header">

    <img id="channelLogo" class="channel-logo" src="" alt="">

    <h2 id="channelTitle"></h2>

    <button class="edit-channel" onclick="editarCanal()">
      Editar canal
    </button>

  </div>


  <div class="section">

    <h2>📋 Programación</h2>

    <div id="week"></div>

  </div>

</main>


<script>

const dias = [
  "Lunes",
  "Martes",
  "Miércoles",
  "Jueves",
  "Viernes",
  "Sábado",
  "Domingo"
];


const canalesBase = [

  {
    clave: "TVN.cl",
    nombre: "TVN",
    id: "TVN.cl",
    logo: "https://raw.githubusercontent.com/amo281212/logos-iptv/refs/heads/main/TVN.png"
  },

  {
    clave: "Mega.cl",
    nombre: "Mega",
    id: "Mega.cl",
    logo: "https://cdn.m3u.cl/logo/455_Mega.png"
  },

  {
    clave: "Chilevision.cl",
    nombre: "Chilevisión",
    id: "Chilevision.cl",
    logo: "https://cdn.m3u.cl/logo/1569_CHV.png"
  },

  {
    clave: "Canal13.cl",
    nombre: "Canal 13",
    id: "Canal13.cl",
    logo: "https://cdn.m3u.cl/logo/1733_Canal_13.png"
  }

];


let canalActual = "";
let canalActualClave = "";
let diaActual = "";


function obtenerDiaActual() {

  const dia = new Date().getDay();

  const conversion = {
    0: "Domingo",
    1: "Lunes",
    2: "Martes",
    3: "Miércoles",
    4: "Jueves",
    5: "Viernes",
    6: "Sábado"
  };

  return conversion[dia];
}


function datosIniciales() {

  const datos = {};

  dias.forEach(dia => {
    datos[dia] = [];
  });

  return datos;
}


function obtenerCanales() {

  const canales = canalesBase.map(canal => ({
    ...canal
  }));


  const ediciones = JSON.parse(
    localStorage.getItem("veo_ediciones_canales") || "[]"
  );


  ediciones.forEach(edicion => {

    const canal = canales.find(
      item => item.clave === edicion.clave
    );


    if (canal) {

      canal.nombre = edicion.nombre;
      canal.id = edicion.id;
      canal.logo = edicion.logo;

    }

  });


  const guardados = JSON.parse(
    localStorage.getItem("veo_canales") || "[]"
  );


  guardados.forEach(canalGuardado => {

    const clave =
      canalGuardado.clave || canalGuardado.id;


    const existente = canales.find(
      item => item.clave === clave
    );


    if (!existente) {

      canales.push({

        clave: clave,

        nombre: canalGuardado.nombre,

        id: canalGuardado.id,

        logo: canalGuardado.logo

      });

    }

  });


  return canales;
}


function obtenerCanalPorClave(clave) {

  const canales = obtenerCanales();

  return canales.find(
    canal => canal.clave === clave
  );
}


function crearTarjetaCanal(nombre, id, logo, clave) {

  const channels =
    document.getElementById("channels");


  const card =
    document.createElement("div");


  card.className = "channel";


  const content =
    document.createElement("div");


  content.className =
    "channel-content";


  content.innerHTML = `

    <img
      class="channel-logo"
      src="${logo}"
      alt="${nombre}"
    >

    <div>

      <div class="channel-name">
        ${nombre}
      </div>

      <div class="channel-id">
        ${id}
      </div>

    </div>

  `;


  card.appendChild(content);


  card.onclick = function() {

    openChannelByKey(clave);

  };


  channels.insertBefore(
    card,
    channels.querySelector(".add-channel")
  );
}


function openChannelByKey(clave) {

  const canal =
    obtenerCanalPorClave(clave);


  if (!canal) {
    return;
  }


  document.getElementById("channels").style.display =
    "none";


  document.getElementById("editor").style.display =
    "block";


  canalActual =
    canal.id;


  canalActualClave =
    canal.clave;


  document.getElementById("channelTitle").textContent =
    canal.nombre;


  document.getElementById("channelLogo").src =
    canal.logo;


  document.getElementById("channelLogo").alt =
    canal.nombre;


  cargarProgramacion(canal);
}


function goBack() {

  document.getElementById("editor").style.display =
    "none";


  document.getElementById("channels").style.display =
    "block";
}


function agregarCanal() {

  const editor =
    document.createElement("div");


  editor.className =
    "program-editor";


  editor.innerHTML = `

    <div class="program-editor-box">

      <h2>Agregar canal</h2>

      <label>Nombre del canal</label>

      <input
        class="editor-nombre"
        type="text"
      >

      <label>ID del canal</label>

      <input
        class="editor-id"
        type="text"
      >

      <label>URL del logo</label>

      <input
        class="editor-logo"
        type="text"
      >

      <div class="editor-buttons">

        <button class="cancel-editor">
          Cancelar
        </button>

        <button class="save-editor">
          Guardar
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(editor);


  editor.querySelector(
    ".cancel-editor"
  ).onclick = function() {

    editor.remove();

  };


  editor.querySelector(
    ".save-editor"
  ).onclick = function() {

    const nombre =
      editor.querySelector(
        ".editor-nombre"
      ).value.trim();


    const id =
      editor.querySelector(
        ".editor-id"
      ).value.trim();


    const logo =
      editor.querySelector(
        ".editor-logo"
      ).value.trim();


    if (!nombre || !id || !logo) {

      alert(
        "Completa todos los campos."
      );

      return;
    }


    const canales =
      JSON.parse(
        localStorage.getItem(
          "veo_canales"
        ) || "[]"
      );


    canales.push({

      clave: id,

      nombre: nombre,

      id: id,

      logo: logo

    });


    localStorage.setItem(
      "veo_canales",
      JSON.stringify(canales)
    );


    crearTarjetaCanal(
      nombre,
      id,
      logo,
      id
    );


    editor.remove();

  };
}


function editarCanal() {

  const canal =
    obtenerCanalPorClave(
      canalActualClave
    );


  if (!canal) {
    return;
  }


  const editor =
    document.createElement("div");


  editor.className =
    "program-editor";


  editor.innerHTML = `

    <div class="program-editor-box">

      <h2>Editar canal</h2>

      <label>Nombre del canal</label>

      <input
        class="editor-nombre"
        type="text"
      >

      <label>ID del canal</label>

      <input
        class="editor-id"
        type="text"
      >

      <label>URL del logo</label>

      <input
        class="editor-logo"
        type="text"
      >

      <div class="editor-buttons">

        <button class="cancel-editor">
          Cancelar
        </button>

        <button class="save-editor">
          Guardar
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(editor);


  editor.querySelector(
    ".editor-nombre"
  ).value =
    canal.nombre;


  editor.querySelector(
    ".editor-id"
  ).value =
    canal.id;


  editor.querySelector(
    ".editor-logo"
  ).value =
    canal.logo;


  editor.querySelector(
    ".cancel-editor"
  ).onclick = function() {

    editor.remove();

  };


  editor.querySelector(
    ".save-editor"
  ).onclick = function() {

    const nuevoNombre =
      editor.querySelector(
        ".editor-nombre"
      ).value.trim();


    const nuevoId =
      editor.querySelector(
        ".editor-id"
      ).value.trim();


    const nuevoLogo =
      editor.querySelector(
        ".editor-logo"
      ).value.trim();


    if (
      !nuevoNombre ||
      !nuevoId ||
      !nuevoLogo
    ) {

      alert(
        "Completa todos los campos."
      );

      return;
    }


    const idAnterior =
      canal.id;


    if (
      idAnterior !== nuevoId
    ) {

      const programacionAnterior =
        localStorage.getItem(
          "veo_programacion_v3_" +
          idAnterior
        );


      if (programacionAnterior) {

        localStorage.setItem(
          "veo_programacion_v3_" +
          nuevoId,
          programacionAnterior
        );


        localStorage.removeItem(
          "veo_programacion_v3_" +
          idAnterior
        );

      }

    }


    const canales =
      JSON.parse(
        localStorage.getItem(
          "veo_canales"
        ) || "[]"
      );


    const canalGuardado =
      canales.find(
        item =>
          (item.clave || item.id) ===
          canalActualClave
      );


    if (canalGuardado) {

      canalGuardado.nombre =
        nuevoNombre;

      canalGuardado.id =
        nuevoId;

      canalGuardado.logo =
        nuevoLogo;

    } else {

      const ediciones =
        JSON.parse(
          localStorage.getItem(
            "veo_ediciones_canales"
          ) || "[]"
        );


      const edicionExistente =
        ediciones.find(
          item =>
            item.clave ===
            canalActualClave
        );


      if (edicionExistente) {

        edicionExistente.nombre =
          nuevoNombre;

        edicionExistente.id =
          nuevoId;

        edicionExistente.logo =
          nuevoLogo;

      } else {

        ediciones.push({

          clave:
            canalActualClave,

          nombre:
            nuevoNombre,

          id:
            nuevoId,

          logo:
            nuevoLogo

        });

      }


      localStorage.setItem(
        "veo_ediciones_canales",
        JSON.stringify(ediciones)
      );

    }


    if (canalGuardado) {

      localStorage.setItem(
        "veo_canales",
        JSON.stringify(canales)
      );

    }


    canalActual =
      nuevoId;


    document.getElementById(
      "channelTitle"
    ).textContent =
      nuevoNombre;


    document.getElementById(
      "channelLogo"
    ).src =
      nuevoLogo;


    document.getElementById(
      "channelLogo"
    ).alt =
      nuevoNombre;


    editor.remove();


    cargarProgramacion({
      clave:
        canalActualClave,

      nombre:
        nuevoNombre,

      id:
        nuevoId,

      logo:
        nuevoLogo

    });


  };

}


function cargarProgramacion(canal) {

  let guardada =
    localStorage.getItem(
      "veo_programacion_v3_" +
      canal.id
    );


  /*
    Compatibilidad con la versión anterior,
    donde TVN usaba "TVN" como clave.
  */

  if (
    !guardada &&
    canal.clave === "TVN.cl"
  ) {

    const antigua =
      localStorage.getItem(
        "veo_programacion_v3_TVN"
      );


    if (antigua) {

      guardada = antigua;


      localStorage.setItem(
        "veo_programacion_v3_" +
        canal.id,
        antigua
      );

    }

  }


  let datos;


  if (guardada) {

    datos =
      JSON.parse(guardada);

  } else {

    datos =
      datosIniciales();


    if (canal.clave === "TVN.cl") {

      datos["Lunes"] = [

        {
          nombre:
            "Buenos días",

          inicio:
            "06:00",

          fin:
            "09:00"
        },

        {
          nombre:
            "Noticias",

          inicio:
            "09:00",

          fin:
            "13:00"
        },

        {
          nombre:
            "24 Horas",

          inicio:
            "13:00",

          fin:
            "14:00"
        }

      ];


      datos["Jueves"] = [

        {
          nombre:
            "Buenos días",

          inicio:
            "06:00",

          fin:
            "09:00"
        },

        {
          nombre:
            "Noticias",

          inicio:
            "09:00",

          fin:
            "13:00"
        },

        {
          nombre:
            "24 Horas",

          inicio:
            "13:00",

          fin:
            "14:00"
        }

      ];

    }

  }


  renderizarSemana(datos);
}


function guardarProgramacion() {

  const datos = {};


  document.querySelectorAll(
    ".day"
  ).forEach(dia => {

    const nombreDia =
      dia.dataset.day;


    datos[nombreDia] = [];


    dia.querySelectorAll(
      ".program"
    ).forEach(programa => {

      datos[nombreDia].push({

        nombre:
          programa.querySelector(
            ".program-name"
          ).textContent,

        inicio:
          programa.dataset.start,

        fin:
          programa.dataset.end

      });

    });

  });


  localStorage.setItem(
    "veo_programacion_v3_" +
    canalActual,
    JSON.stringify(datos)
  );
}


function renderizarSemana(datos) {

  const contenedor =
    document.getElementById("week");


  contenedor.innerHTML =
    "";


  diaActual =
    obtenerDiaActual();


  dias.forEach(dia => {

    const bloque =
      document.createElement("div");


    bloque.className =
      "day";


    bloque.dataset.day =
      dia;


    if (dia === diaActual) {

      bloque.classList.add(
        "open"
      );

    }


    const boton =
      document.createElement("button");


    boton.className =
      "day-title";


    boton.textContent =
      dia;


    boton.onclick =
      function() {

        toggleDay(boton);

      };


    const contenido =
      document.createElement("div");


    contenido.className =
      "day-content";


    const programas =
      datos[dia] || [];


    programas.forEach(
      programa => {

        contenido.appendChild(

          crearPrograma(
            programa.nombre,
            programa.inicio,
            programa.fin
          )

        );

      }
    );


    const botonAgregar =
      document.createElement("button");


    botonAgregar.className =
      "add";


    botonAgregar.textContent =
      "＋ Agregar programa";


    botonAgregar.onclick =
      function() {

        agregarPrograma(dia);

      };


    contenido.appendChild(
      botonAgregar
    );


    bloque.appendChild(
      boton
    );


    bloque.appendChild(
      contenido
    );


    contenedor.appendChild(
      bloque
    );

  });
}


function crearPrograma(
  nombre,
  inicio,
  fin
) {

  const programa =
    document.createElement("div");


  programa.className =
    "program";


  programa.dataset.start =
    inicio;


  programa.dataset.end =
    fin;


  const tiempo =
    document.createElement("div");


  tiempo.className =
    "time";


  tiempo.textContent =
    inicio +
    " - " +
    fin;


  const nombrePrograma =
    document.createElement("div");


  nombrePrograma.className =
    "program-name";


  nombrePrograma.textContent =
    nombre;


  const editar =
    document.createElement("button");


  editar.className =
    "edit";


  editar.textContent =
    "Editar";


  editar.onclick =
    function() {

      editarPrograma(
        editar
      );

    };


  programa.appendChild(
    tiempo
  );


  programa.appendChild(
    nombrePrograma
  );


  programa.appendChild(
    editar
  );


  return programa;
}


function toggleDay(boton) {

  const dia =
    boton.parentElement;


  document.querySelectorAll(
    ".day"
  ).forEach(otro => {

    if (otro !== dia) {

      otro.classList.remove(
        "open"
      );

    }

  });


  dia.classList.toggle(
    "open"
  );


  if (
    dia.classList.contains(
      "open"
    )
  ) {

    diaActual =
      dia.dataset.day;

  }
}

function escaparXML(texto) {

  return String(texto)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&apos;"
    );

}


function obtenerProgramacionCanalPorId(
  canal
) {

  const guardada =
    localStorage.getItem(
      "veo_programacion_v3_" +
      canal.id
    );


  if (guardada) {

    return JSON.parse(
      guardada
    );

  }


  if (
    canal.clave === "TVN.cl"
  ) {

    const antigua =
      localStorage.getItem(
        "veo_programacion_v3_TVN"
      );


    if (antigua) {

      return JSON.parse(
        antigua
      );

    }

  }


  return datosIniciales();
}


function formatoFechaXML(fecha) {

  const año =
    fecha.getFullYear();


  const mes =
    String(
      fecha.getMonth() + 1
    ).padStart(2, "0");


  const dia =
    String(
      fecha.getDate()
    ).padStart(2, "0");


  const horas =
    String(
      fecha.getHours()
    ).padStart(2, "0");


  const minutos =
    String(
      fecha.getMinutes()
    ).padStart(2, "0");


  const offset =
    -fecha.getTimezoneOffset();


  const signo =
    offset >= 0
      ? "+"
      : "-";


  const offsetAbs =
    Math.abs(offset);


  const offsetHoras =
    String(
      Math.floor(
        offsetAbs / 60
      )
    ).padStart(
      2,
      "0"
    );


  const offsetMinutos =
    String(
      offsetAbs % 60
    ).padStart(
      2,
      "0"
    );


  return (
    año +
    mes +
    dia +
    horas +
    minutos +
    "00 " +
    signo +
    offsetHoras +
    offsetMinutos
  );

}


function crearFechaPrograma(
  fechaBase,
  hora
) {

  const partes =
    hora.split(":");


  const horas =
    parseInt(
      partes[0],
      10
    );


  const minutos =
    parseInt(
      partes[1],
      10
    );


  const fecha =
    new Date(
      fechaBase
    );


  fecha.setHours(
    horas
  );


  fecha.setMinutes(
    minutos
  );


  fecha.setSeconds(
    0
  );


  fecha.setMilliseconds(
    0
  );


  return fecha;
}


function generarXMLTV() {

  guardarProgramacion();


  const canales =
    obtenerCanales();


  let xml = "";


  xml +=
    '<?xml version="1.0" encoding="UTF-8"?>\n';


  xml +=
    '<tv generator-info-name="Veo" generator-info-url="https://amo281212.github.io/Veo/">\n';


  /* CANALES */

  canales.forEach(
    canal => {

      xml +=
        '  <channel id="' +
        escaparXML(
          canal.id
        ) +
        '">\n';


      xml +=
        '    <display-name>' +
        escaparXML(
          canal.nombre
        ) +
        '</display-name>\n';


      if (canal.logo) {

        xml +=
          '    <icon src="' +
          escaparXML(
            canal.logo
          ) +
          '"/>\n';

      }


      xml +=
        '  </channel>\n';

    }
  );


  /* PROGRAMACIÓN */

  const fechaInicio =
    new Date();


  fechaInicio.setHours(
    0
  );


  fechaInicio.setMinutes(
    0
  );


  fechaInicio.setSeconds(
    0
  );


  fechaInicio.setMilliseconds(
    0
  );


  for (
    let i = 0;
    i < 14;
    i++
  ) {

    const fecha =
      new Date(
        fechaInicio
      );


    fecha.setDate(
      fechaInicio.getDate() +
      i
    );


    const diaSemana =
      dias[
        (fecha.getDay() + 6) %
        7
      ];


    canales.forEach(
      canal => {

        const datos =
          obtenerProgramacionCanalPorId(
            canal
          );


        const programas =
          datos[
            diaSemana
          ] || [];


        programas.forEach(
          programa => {

            const inicio =
              crearFechaPrograma(
                fecha,
                programa.inicio
              );


            const fin =
              crearFechaPrograma(
                fecha,
                programa.fin
              );


            if (
              fin <= inicio
            ) {

              fin.setDate(
                fin.getDate() +
                1
              );

            }


            xml +=
              '  <programme channel="' +
              escaparXML(
                canal.id
              ) +
              '" start="' +
              formatoFechaXML(
                inicio
              ) +
              '" stop="' +
              formatoFechaXML(
                fin
              ) +
              '">\n';


            xml +=
              '    <title lang="es">' +
              escaparXML(
                programa.nombre
              ) +
              '</title>\n';


            xml +=
              '  </programme>\n';

          }
        );

      }
    );

  }


  xml +=
    "</tv>";


  const archivo =
    new Blob(
      [xml],
      {
        type:
          "application/xml;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      archivo
    );


  const enlace =
    document.createElement(
      "a"
    );


  enlace.href =
    url;


  enlace.download =
    "epg.xml";


  document.body.appendChild(
    enlace
  );


  enlace.click();


  enlace.remove();


  URL.revokeObjectURL(
    url
  );

}
