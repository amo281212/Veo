<script>

const dias=[
"Lunes",
"Martes",

"Jueves",
"Viernes",
"Sábado",
"Domingo"
];

const canalesBase=[

{
clave:"TVN.cl",
nombre:"TVN",
id:"TVN.cl",
logo:"https://raw.githubusercontent.com/amo281212/logos-iptv/refs/heads/main/TVN.png"
},

{
clave:"Mega.cl",
nombre:"Mega",
id:"Mega.cl",
logo:"https://cdn.m3u.cl/logo/455_Mega.png"
},

{
clave:"Chilevision.cl",
nombre:"Chilevisión",
id:"Chilevision.cl",
logo:"https://cdn.m3u.cl/logo/1569_CHV.png"
},

{
clave:"Canal13.cl",
nombre:"Canal 13",
id:"Canal13.cl",

}

];

const GITHUB_OWNER="amo281212";
const GITHUB_REPO="Veo";
const GITHUB_BRANCH="main";

const GITHUB_FILE="veo.json";
const EPG_FILE="epg.xml";

let estado={
canales:[],
eliminados:[],
programacion:{}
};

let canalActual="";
let canalActualClave="";
let diaActual="";

let colaSincronizacion=Promise.resolve();


/* =====================================================
   DATOS INICIALES
===================================================== */

function datosIniciales(){

const datos={};

dias.forEach(
dia=>{
datos[dia]=[];
}
);

return datos;

}


function programacionTVNInicial(){

const datos=datosIniciales();

const programas=[

{
nombre:"Buenos días",
inicio:"06:00",
fin:"09:00"
},

{
nombre:"Noticias",
inicio:"09:00",
fin:"13:00"
},

{
nombre:"24 Horas",
inicio:"13:00",
fin:"14:00"
}

];

datos.Lunes=
JSON.parse(
JSON.stringify(programas)
);

datos.Jueves=
JSON.parse(
JSON.stringify(programas
)
);

return datos;

}


function crearEstadoInicial(){

const canales=
canalesBase.map(
canal=>({...canal})
);

const programacion={};

canales.forEach(
canal=>{

programacion[canal.clave]=
canal.clave==="TVN.cl"
?
programacionTVNInicial()
:
datosIniciales();

}
);

return{

canales:canales,
eliminados:[],
programacion:programacion

};

}


/* =====================================================
   HORARIOS
===================================================== */

function normalizarHora(valor){

const texto=
String(
valor||
""
)
.trim();

const numeros=
texto.replace(
/\D/g,
""
);

if(
numeros.length!==4
){

return null;

}

const horas=
parseInt(
numeros.substring(
0,
2
),
10
);

const minutos=
parseInt(
numeros.substring(
2,
4
),
10
);

if(
horas<0||
horas>23||
minutos<0||
minutos>59
){

return null;

}

return(
String(
horas
)
.padStart(
2,
"0"
)+
":"+
String(
minutos
)
.padStart(
2,
"0"
)
);

}


function horaParaEntrada(
hora
){

return String(
hora||
""
)
.replace(
":",
""
);

}


function prepararCampoHora(
input
){

input.addEventListener(
"input",
function(){

this.value=
this.value
.replace(
/\D/g,
""
)
.slice(
0,
4
);

}
);

}


/* =====================================================
   TOKEN DE GITHUB
===================================================== */

function obtenerTokenGitHub(){

return localStorage.getItem(
"veo_github_token"
);

}


function abrirEditorToken(){

return new Promise(
resolve=>{

const editor=
document.createElement(
"div"
);

editor.className=
"program-editor";

editor.innerHTML=`

<div class="program-editor-box">

<h2>Conectar GitHub</h2>

<div class="epg-status">

Veo necesita tu token de GitHub
para cargar y guardar los cambios
en todos tus dispositivos.

</div>

<label>Token de GitHub</label>

<input
class="epg-token-input"
type="password"
autocomplete="off"
placeholder="github_pat_..."
>

<div class="epg-token-note">

El token se guardará solamente
en este navegador.

</div>

<div class="editor-buttons">

<button class="cancel-editor">
Cancelar
</button>

<button class="save-editor">
Guardar
</button>

</div>

</div>

`;

document.body.appendChild(
editor
);

const input=
editor.querySelector(
"input"
);

setTimeout(
()=>{
input.focus();
},
50
);

editor.querySelector(
".cancel-editor"
).onclick=
function(){

editor.remove();

resolve(null);

};

editor.querySelector(
".save-editor"
).onclick=
function(){

const token=
input.value.trim();

if(!token){

alert(
"Ingresa el token de GitHub."
);

return;

}

localStorage.setItem(
"veo_github_token",
token
);

editor.remove();

resolve(token);

};

}
);

}


async function obtenerTokenParaGitHub(){

let token=
obtenerTokenGitHub();

if(token){

return token;

}

return await abrirEditorToken();

}


/* =====================================================
   GITHUB
===================================================== */

function convertirBase64(texto){

const bytes=
new TextEncoder().encode(
texto
);

let binario="";

const tamaño=0x8000;

for(
let i=0;
i<bytes.length;
i+=tamaño
){

binario+=
String.fromCharCode(
...bytes.subarray(
i,
i+tamaño
)
);

}

return btoa(
binario
);

}


function decodificarBase64(base64){

const limpio=
base64.replace(
/\s/g,
""
);

const binario=
atob(
limpio
);

const bytes=
new Uint8Array(
binario.length
);

for(
let i=0;
i<binario.length;
i++
){

bytes[i]=
binario.charCodeAt(
i
);

}

return new TextDecoder(
"utf-8"
).decode(
bytes
);

}


async function obtenerSHA(
archivo,
token
){

const respuesta=
await fetch(

"https://api.github.com/repos/"+
GITHUB_OWNER+"/"+
GITHUB_REPO+
"/contents/"+
archivo+
"?ref="+
GITHUB_BRANCH+
"&t="+
Date.now(),

{
method:"GET",

headers:{

"Accept":
"application/vnd.github+json",

"Authorization":
"Bearer "+token,

"X-GitHub-Api-Version":
"2026-03-10"

}

}

);

if(
respuesta.status===
404
){

return null;

}

if(!respuesta.ok){

throw new Error(
"GitHub respondió "+
respuesta.status
);

}

const datos=
await respuesta.json();

return datos.sha;

}


/* =====================================================
   SUBIR ARCHIVO
===================================================== */

async function subirArchivo(
archivo,
contenido,
mensaje,
token
){

async function intentarSubir(){

const sha=
await obtenerSHA(
archivo,
token
);

const cuerpo={

message:
mensaje,

content:
convertirBase64(
contenido
),

branch:
GITHUB_BRANCH

};

if(sha){

cuerpo.sha=
sha;

}

const respuesta=
await fetch(

"https://api.github.com/repos/"+
GITHUB_OWNER+"/"+
GITHUB_REPO+
"/contents/"+
archivo,

{

method:"PUT",

headers:{

"Accept":
"application/vnd.github+json",

"Authorization":
"Bearer "+token,

"X-GitHub-Api-Version":
"2026-03-10",

"Content-Type":
"application/json"

},

body:
JSON.stringify(
cuerpo
)

}

);

return respuesta;

}

let respuesta=
await intentarSubir();

if(
respuesta.status===
409
){

await new Promise(
resolve=>
setTimeout(
resolve,
500
)
);

respuesta=
await intentarSubir();

}

if(!respuesta.ok){

const texto=
await respuesta.text();

throw new Error(
"GitHub respondió "+
respuesta.status+
": "+
texto
);

}

return respuesta.json();

}


/* =====================================================
   CARGAR ESTADO REMOTO
===================================================== */

async function cargarEstadoRemoto(){

const token=
await obtenerTokenParaGitHub();

if(!token){

return null;

}

const respuesta=
await fetch(

"https://api.github.com/repos/"+
GITHUB_OWNER+"/"+
GITHUB_REPO+
"/contents/"+
GITHUB_FILE+
"?ref="+
GITHUB_BRANCH+
"&t="+
Date.now(),

{
method:"GET",

headers:{

"Accept":
"application/vnd.github+json",

"Authorization":
"Bearer "+token,

"X-GitHub-Api-Version":
"2026-03-10"

}

}

);

if(
respuesta.status===
404
){

return null;

}

if(!respuesta.ok){

const texto=
await respuesta.text();

throw new Error(
"GitHub respondió "+
respuesta.status+
": "+
texto
);

}

const archivo=
await respuesta.json();

if(
!archivo.content
){

throw new Error(
"GitHub no devolvió el contenido de veo.json."
);

}

const texto=
decodificarBase64(
archivo.content
);

const remoto=
JSON.parse(
texto
);

if(
!remoto||
!Array.isArray(
remoto.canales
)||
!remoto.programacion
){

throw new Error(
"El archivo veo.json no tiene un formato válido."
);

}

return{

canales:
remoto.canales,

eliminados:
Array.isArray(
remoto.eliminados
)
?
remoto.eliminados
:
[],

programacion:
normalizarProgramacionRemota(
remoto.programacion
)

};

}


/* =====================================================
   NORMALIZAR PROGRAMACIÓN EXISTENTE
===================================================== */

function normalizarProgramacionRemota(
programacion
){

const resultado={};

Object.keys(
programacion||{}
)
.forEach(
clave=>{

const datosCanal=
programacion[clave]||
{};

resultado[clave]={};

dias.forEach(
dia=>{

const programas=
Array.isArray(
datosCanal[dia]
)
?
datosCanal[dia]
:
[];

resultado[clave][dia]=
programas
.map(
programa=>{

const inicio=
normalizarHora(
programa.inicio
);

const fin=
normalizarHora(
programa.fin
);

return{

nombre:
String(
programa.nombre||
""
),

inicio:
inicio||
String(
programa.inicio||
""
),

fin:
fin||
String(
programa.fin||
""
),

descripcion:
String(
programa.descripcion||
""
)

};

}
);

}
);

}
);

return resultado;

}


/* =====================================================
   SINCRONIZACIÓN
===================================================== */

function sincronizarEstado(){

const contenido=
JSON.stringify(
estado,
null,
2
);

colaSincronizacion=
colaSincronizacion
.then(
async function(){

const token=
await obtenerTokenParaGitHub();

if(!token){

return false;

}

try{

await subirArchivo(

GITHUB_FILE,

contenido,

"Actualizar datos de Veo",

token

);

return true;

}catch(error){

if(
String(
error.message
)
.includes("401")
){

localStorage.removeItem(
"veo_github_token"
);

}

console.error(error);

alert(
"No se pudieron guardar los cambios en GitHub.\n\n"+
error.message
);

return false;

}

}
)
.catch(
function(error){

console.error(error);

alert(
"No se pudieron guardar los cambios en GitHub.\n\n"+
error.message
);

return false;

}
);

return colaSincronizacion;

}


/* =====================================================
   CANALES
===================================================== */

function obtenerCanales(){

return estado.canales;

}


function obtenerCanalPorClave(
clave
){

return estado.canales.find(
canal=>
canal.clave===
clave
);

}


function escapeHTML(
texto
){

return String(
texto
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


function crearTarjetaCanal(
nombre,
id,
logo,
clave
){

const channels=
document.getElementById(
"channels"
);

const card=
document.createElement(
"div"
);

card.className=
"channel";

card.dataset.channelKey=
clave;

card.innerHTML=`

<div class="channel-content">

<img
class="channel-logo"
src="${escapeHTML(logo)}"
alt="${escapeHTML(nombre)}"
>

<div>

<div class="channel-name">
${escapeHTML(nombre)}
</div>

<div class="channel-id">
${escapeHTML(id)}
</div>

</div>

</div>

`;

let arrastrando=false;
let presionTimer=null;
let inicioX=0;
let inicioY=0;

card.onclick=
function(){

if(arrastrando){

return;

}

openChannelByKey(
clave
);

};


/* ==============================
   MANTENER PRESIONADO
   ============================== */

card.addEventListener(
"pointerdown",
function(e){

if(
e.pointerType!=="touch"
){

return;

}

inicioX=
e.clientX;

inicioY=
e.clientY;

presionTimer=
setTimeout(
function(){

arrastrando=true;

card.classList.add(
"dragging"
);

card.setPointerCapture(
e.pointerId
);

},
400
);

}
);


/* ==============================
   MOVER CON EL DEDO
   ============================== */

card.addEventListener(
"pointermove",
function(e){

if(
e.pointerType!=="touch"
){

return;

}

if(!arrastrando){

const distancia=
Math.sqrt(
Math.pow(
e.clientX-inicioX,
2
)+
Math.pow(
e.clientY-inicioY,
2
)
);

if(
distancia>10
){

clearTimeout(
presionTimer
);

}

return;

}

e.preventDefault();

const tarjetas=
[
...
document.querySelectorAll(
"#channels .channel"
)
]
.filter(
tarjeta=>
tarjeta!==card
);

let objetivo=null;

tarjetas.forEach(
tarjeta=>{

const rect=
tarjeta.getBoundingClientRect();

const mitad=
rect.top+
rect.height/2;

if(
e.clientY<mitad&&
!objetivo
){

objetivo=tarjeta;

}

}
);

if(
objetivo
){

objetivo.classList.add(
"drag-over"
);

card.parentNode.insertBefore(
card,
objetivo
);

}else{

const ultima=
tarjetas[

);

);

);

card.classList.remove(

);

   ============================== */

function(){

presionTimer
);

arrastrando=false;

card.classList.remove(
"dragging"
);

"#channels .channel"

.forEach(

)
);

);


/* ==============================

   ============================== */

card.draggable=true;

card.addEventListener(
"dragstart",
function(){

arrastrando=true;

card.classList.add(
"dragging"
);

}
);

card.addEventListener(
"dragover",
function(e){

e.preventDefault();

if(
!arrastrando||
card===document.querySelector(
".channel.dragging"
)
){

return;

}

const arrastrado=
document.querySelector(
".channel.dragging"
);

if(
!arrastrado
){

return;

}

const rect=
card.getBoundingClientRect();

const mitad=
rect.top+
rect.height/2;

if(
e.clientY<mitad
){

card.parentNode.insertBefore(
arrastrado,
card
);

}else{

card.parentNode.insertBefore(
arrastrado,
card.nextSibling
);

}

}
);

card.addEventListener(
"dragend",
function(){

arrastrando=false;

card.classList.remove(
"dragging"
);

guardarOrdenCanales();

}
);

channels.insertBefore(

card,

channels.querySelector(
".add-channel"
)

);

}

/* =====================================================

async function eliminarTodosLosProgramas(
dia
){

const bloqueDia=
document.querySelector(
'.day[data-day="'+
dia+
'"]'
);

}

bloqueDia.querySelectorAll(
".program"
);

){

}

!confirm(
"¿Borrar todos los programas de "+dia+"?"
)
){

return;

}

const estadoAnterior=
JSON.parse(
JSON.stringify(
estado
)
);

const boton=
bloqueDia.querySelector(
".delete-all-programs"
);

if(boton){

boton.disabled=
true;

boton.textContent=
"Borrando...";

}

programas.forEach(
programa=>
programa.remove()
);

bloqueDia
.querySelector(
".day-title"
)
.classList.remove(
"has-programs"
);

const guardado=
await guardarProgramacionDesdeDOM();

if(
guardado
){

if(boton){

boton.disabled=
false;

boton.textContent=
"Borrar todos los programas";

}

return;

}

estado=
estadoAnterior;

const canal=
obtenerCanalPorClave(
canalActualClave
);

if(canal){

cargarProgramacion(
canal
);

}

}

}

);

<label>Nombre del canal</label>

class="editor-nombre"

>

<label>ID del canal</label>

type="text"
>

type="text"
>

<div class="editor-buttons">

</button>

</button>

);

);

)

.querySelector(

)
.value
.trim();

)
.value

);

"Guardar";

}

};

function eliminarCanal(){

if(

){

);

const editor=

);

</button>

</button>

);

)
.onclick=
function(){

editor.querySelector(
".delete-confirm"
)
.onclick=
async function(){

editor.querySelector(
".delete-confirm"
);

editor.querySelector(

);

);

const canal=

);

if(

canal.nombre+

)
){

}

botonEliminar.disabled=
true;

botonEliminar.textContent=
"Eliminando...";

const esBase=
canalesBase.some(
base=>

canal.clave
);

)
);

estado.canales=

item=>
item.clave!==
canal.clave
);

delete estado.programacion[
canal.clave
];

)
){

);

false;

}

};

/* =====================================================
   XMLTV
===================================================== */

function escaparXML(
texto
){

return String(
texto
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&apos;"
);

}


function obtenerProgramacionCanal(
canal
){

return estado.programacion[
canal.clave
]||
datosIniciales();

}


function formatoFechaXML(
fecha
){

const año=
fecha.getFullYear();

const mes=
String(
fecha.getMonth()+1
)
.padStart(
2,
"0"
);

const dia=
String(
fecha.getDate()
)
.padStart(
2,
"0"
);

const horas=
String(
fecha.getHours()
)
.padStart(
2,
"0"
);

const minutos=
String(
fecha.getMinutes()
)
.padStart(
2,
"0"
);

const offset=
-fecha.getTimezoneOffset();

const signo=
offset>=0
?
"+"
:
"-";

const offsetAbs=
Math.abs(
offset
);

const offsetHoras=
String(
Math.floor(
offsetAbs/60
)
)
.padStart(
2,
"0"
);

const offsetMinutos=
String(
offsetAbs%60
)
.padStart(
2,
"0"
);

return(
año+
mes+
dia+
horas+
minutos+
"00 "+
signo+
offsetHoras+
offsetMinutos
);

}


function crearFechaPrograma(
fechaBase,
hora
){

const horaNormalizada=
normalizarHora(
hora
);

if(
!horaNormalizada
){

throw new Error(
"Horario inválido: "+
hora
);

}

const partes=
horaNormalizada.split(":");

const horas=
parseInt(
partes[0],
10
);

const minutos=
parseInt(
partes[1],
10
);

const fecha=
new Date(
fechaBase
);

fecha.setHours(
horas
);

fecha.setMinutes(
minutos
);

fecha.setSeconds(
0
);

fecha.setMilliseconds(
0
);

return fecha;

}


function generarXMLTV(){

let xml=
'<?xml version="1.0" encoding="UTF-8"?>\n';

xml+=
'<tv generator-info-name="Veo" generator-info-url="https://amo281212.github.io/Veo/">\n';

estado.canales.forEach(
canal=>{

xml+=
'  <channel id="'+
escaparXML(
canal.id
)+
'">\n';

xml+=
'    <display-name>'+
escaparXML(
canal.nombre
)+
'</display-name>\n';

if(canal.logo){

xml+=
'    <icon src="'+
escaparXML(
canal.logo
)+
'"/>\n';

}

xml+=
'  </channel>\n';

}
);

const fechaInicio=
new Date();

fechaInicio.setHours(
0
);

fechaInicio.setMinutes(
0
);

fechaInicio.setSeconds(
0
);

fechaInicio.setMilliseconds(
0
);

for(
let i=0;
i<14;
i++
){

const fecha=
new Date(
fechaInicio
);

fecha.setDate(
fechaInicio.getDate()+i
);

const diaSemana=
dias[
(fecha.getDay()+6)%7
];

estado.canales.forEach(
canal=>{

const datos=
obtenerProgramacionCanal(
canal
);

const programas=
datos[
diaSemana
]||
[];

programas.forEach(
programa=>{

const inicio=
crearFechaPrograma(
fecha,
programa.inicio
);

const fin=
crearFechaPrograma(
fecha,
programa.fin
);

if(
fin<=inicio
){

fin.setDate(
fin.getDate()+1
);

}

xml+=
'  <programme channel="'+
escaparXML(
canal.id
)+
'" start="'+
formatoFechaXML(
inicio
)+
'" stop="'+
formatoFechaXML(
fin
)+
'">\n';

xml+=
'    <title lang="es">'+
escaparXML(
programa.nombre
)+
'</title>\n';

if(
programa.descripcion&&
String(
programa.descripcion
)
.trim()
){

xml+=
'    <desc lang="es">'+
escaparXML(
programa.descripcion
)+
'</desc>\n';

}

xml+=
'  </programme>\n';

}
);

}
);

}

xml+=
"</tv>";

return xml;

}


/* =====================================================
   ACTUALIZAR EPG
===================================================== */

async function actualizarEPG(){

const boton=
document.querySelector(
".update-epg"
);

const textoOriginal=
boton.textContent;

try{

boton.disabled=
true;

boton.textContent=
"Guardando datos...";

const token=
await obtenerTokenParaGitHub();

if(!token){

boton.disabled=
false;

boton.textContent=
textoOriginal;

return;

}

boton.textContent=
"Sincronizando Veo...";

await subirArchivo(

GITHUB_FILE,

JSON.stringify(
estado,
null,
2
),

"Actualizar datos de Veo",

token

);

boton.textContent=
"Generando EPG...";

const xml=
generarXMLTV();

boton.textContent=
"Subiendo EPG...";

await subirArchivo(

EPG_FILE,

xml,

"Actualizar EPG desde Veo",

token

);

boton.textContent=
"EPG actualizado";

setTimeout(
function(){

boton.disabled=
false;

boton.textContent=
textoOriginal;

},
2500
);

alert(
"Veo y EPG actualizados correctamente en GitHub."
);

}catch(error){

console.error(
error
);

if(
String(
error.message
)
.includes("401")
){

localStorage.removeItem(
"veo_github_token"
);

}

boton.disabled=
false;

boton.textContent=
textoOriginal;

alert(
"No se pudo actualizar.\n\n"+
error.message
);

}

}
