<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101114;
  color: white;
}

header {
  padding: 25px 20px;
  background: #181a1f;
  border-bottom: 1px solid #292c33;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 6px 0 0;
  color: #999;
}

main {
  padding: 20px;
  max-width: 800px;
  margin: auto;
}

.channel {
  background: #191b20;
  border: 1px solid #292c33;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
  cursor: pointer;
}

.channel-content {
  display: flex;
  align-items: center;
  gap: 14px;
}

.channel-logo {
  width: 52px;
  height: 52px;
  object-fit: contain;
  flex-shrink: 0;
  border-radius: 12px;
}

.channel-name {
  font-size: 19px;
  font-weight: bold;
}

.channel-id {
  color: #888;
  font-size: 13px;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: white;
  color: #111;
  font-size: 16px;
  cursor: pointer;
}

#editor {
  display: none;
}

.back {
  background: #292c33;
  color: white;
  margin-bottom: 20px;
}

.channel-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}

.channel-header h2 {
  margin: 0;
}

.section {
  background: #191b20;
  border: 1px solid #292c33;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
}

.section h2 {
  margin-top: 0;
  font-size: 18px;
}

.day {
  border-bottom: 1px solid #292c33;
}

.day:last-child {
  border-bottom: 0;
}

.day-title {
  width: 100%;
  padding: 16px 4px;
  background: transparent;
  color: white;
  text-align: left;
  font-size: 16px;
  font-weight: bold;
  border-radius: 0;
  position: relative;
}

.day-title::after {
  content: "›";
  position: absolute;
  right: 5px;
  font-size: 22px;
  color: #888;
  transform: rotate(0deg);
  transition: transform 0.2s;
}

.day.open .day-title::after {
  transform: rotate(90deg);
}

.day-content {
  display: none;
  padding-bottom: 8px;
}

.day.open .day-content {
  display: block;
}

.program {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #292c33;
}

.program:last-of-type {
  border-bottom: 0;
}

.time {
  color: #aaa;
  width: 120px;
  flex-shrink: 0;
}

.program-name {
  flex: 1;
}

.edit {
  width: auto;
  padding: 8px 12px;
  background: #292c33;
  color: white;
  font-size: 13px;
}

.add {
  margin-top: 15px;
}

/* EDITOR DE PROGRAMA */

.program-editor {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.program-editor-box {
  width: 100%;
  max-width: 500px;
  background: #191b20;
  border: 1px solid #292c33;
  border-radius: 16px;
  padding: 22px;
}

.program-editor-box h2 {
  margin: 0 0 22px;
  font-size: 21px;
}

.program-editor-box label {
  display: block;
  margin-bottom: 7px;
  color: #aaa;
  font-size: 14px;
}

.program-editor-box input {
  width: 100%;
  padding: 13px;
  margin-bottom: 17px;
  border: 1px solid #353941;
  border-radius: 9px;
  background: #101114;
  color: white;
  font-size: 16px;
  outline: none;
}

.program-editor-box input:focus {
  border-color: #666;
}

.editor-buttons {
  display: flex;
  gap: 10px;
  margin-top: 5px;
}

.editor-buttons button {
  flex: 1;
}

.cancel-editor {
  background: #292c33;
  color: white;
}

.save-editor {
  background: white;
  color: #111;
}
</style>
</head>

<body>

<header>
  <h1>Veo</h1>
  <p>Editor de programación televisiva</p>
</header>

<main id="channels">

  <div class="channel" onclick="openChannel('TVN', 'https://raw.githubusercontent.com/amo281212/logos-iptv/refs/heads/main/TVN.png')">
    <div class="channel-content">
      <img class="channel-logo" src="https://raw.githubusercontent.com/amo281212/logos-iptv/refs/heads/main/TVN.png" alt="TVN">
      <div>
        <div class="channel-name">TVN</div>
        <div class="channel-id">TVN.cl</div>
      </div>
    </div>
  </div>

  <div class="channel" onclick="openChannel('Mega', 'https://cdn.m3u.cl/logo/455_Mega.png')">
    <div class="channel-content">
      <img class="channel-logo" src="https://cdn.m3u.cl/logo/455_Mega.png" alt="Mega">
      <div>
        <div class="channel-name">Mega</div>
        <div class="channel-id">Mega.cl</div>
      </div>
    </div>
  </div>

  <div class="channel" onclick="openChannel('Chilevisión', 'https://cdn.m3u.cl/logo/1569_CHV.png')">
    <div class="channel-content">
      <img class="channel-logo" src="https://cdn.m3u.cl/logo/1569_CHV.png" alt="Chilevisión">
      <div>
        <div class="channel-name">Chilevisión</div>
        <div class="channel-id">Chilevision.cl</div>
      </div>
    </div>
  </div>

  <div class="channel" onclick="openChannel('Canal 13', 'https://cdn.m3u.cl/logo/1733_Canal_13.png')">
    <div class="channel-content">
      <img class="channel-logo" src="https://cdn.m3u.cl/logo/1733_Canal_13.png" alt="Canal 13">
      <div>
        <div class="channel-name">Canal 13</div>
        <div class="channel-id">Canal13.cl</div>
      </div>
    </div>
  </div>

  <button class="add-channel" onclick="agregarCanal()">＋ Agregar canal</button>

</main>

<main id="editor">

  <button class="back" onclick="goBack()">← Volver a canales</button>

  <div class="channel-header">
    <img id="channelLogo" class="channel-logo" src="" alt="">
    <h2 id="channelTitle"></h2>
  </div>

  <div class="section">
    <h2>📋 Programación</h2>

    <div id="week"></div>

  </div>

</main>

<script>

const dias = [
  "Lunes",
  "Martes",
  "Miércoles",
  "Jueves",
  "Viernes",
  "Sábado",
  "Domingo"
];

let canalActual = "";
let diaActual = "";

function obtenerDiaActual() {
  const dia = new Date().getDay();

  const conversion = {
    0: "Domingo",
    1: "Lunes",
    2: "Martes",
    3: "Miércoles",
    4: "Jueves",
    5: "Viernes",
    6: "Sábado"
  };

  return conversion[dia];
}

function datosIniciales() {
  const datos = {};

  dias.forEach(dia => {
    datos[dia] = [];
  });

  return datos;
}

function crearTarjetaCanal(nombre, id, logo) {
  const channels = document.getElementById("channels");

  const card = document.createElement("div");
  card.className = "channel";

  const content = document.createElement("div");
  content.className = "channel-content";

  content.innerHTML = `
    <img class="channel-logo" src="${logo}" alt="${nombre}">
    <div>
      <div class="channel-name">${nombre}</div>
      <div class="channel-id">${id}</div>
    </div>
  `;

  card.appendChild(content);

  card.onclick = function() {
    openChannel(id, logo);
  };

  channels.insertBefore(
    card,
    channels.querySelector(".add-channel")
  );
}

function openChannel(channel, logo) {
  document.getElementById("channels").style.display = "none";
  document.getElementById("editor").style.display = "block";

  canalActual = channel;

  document.getElementById("channelTitle").textContent = channel;
  document.getElementById("channelLogo").src = logo;
  document.getElementById("channelLogo").alt = channel;

  cargarProgramacion(channel);
}

function goBack() {
  document.getElementById("editor").style.display = "none";
  document.getElementById("channels").style.display = "block";
}

function agregarCanal() {
  const nombre = prompt("Nombre del canal:");

  if (!nombre) return;

  const id = prompt("ID del canal:");

  if (!id) return;

  const logo = prompt("URL del logo:");

  if (!logo) return;

  const canales = JSON.parse(
    localStorage.getItem("veo_canales") || "[]"
  );

  canales.push({
    nombre: nombre,
    id: id,
    logo: logo
  });

  localStorage.setItem(
    "veo_canales",
    JSON.stringify(canales)
  );

  crearTarjetaCanal(
    nombre,
    id,
    logo
  );

  alert("Canal agregado: " + nombre);
}

function cargarProgramacion(canal) {

  const guardada = localStorage.getItem(
    "veo_programacion_v3_" + canal
  );

  let datos;

  if (guardada) {
    datos = JSON.parse(guardada);
  } else {
    datos = datosIniciales();

    if (canal === "TVN") {
      datos["Lunes"] = [
        {
          nombre: "Buenos días",
          inicio: "06:00",
          fin: "09:00"
        },
        {
          nombre: "Noticias",
          inicio: "09:00",
          fin: "13:00"
        },
        {
          nombre: "24 Horas",
          inicio: "13:00",
          fin: "14:00"
        }
      ];

      datos["Jueves"] = [
        {
          nombre: "Buenos días",
          inicio: "06:00",
          fin: "09:00"
        },
        {
          nombre: "Noticias",
          inicio: "09:00",
          fin: "13:00"
        },
        {
          nombre: "24 Horas",
          inicio: "13:00",
          fin: "14:00"
        }
      ];
    }
  }

  renderizarSemana(datos);
}

function guardarProgramacion() {

  const datos = {};

  document.querySelectorAll(".day").forEach(dia => {

    const nombreDia = dia.dataset.day;
    datos[nombreDia] = [];

    dia.querySelectorAll(".program").forEach(programa => {

      datos[nombreDia].push({
        nombre: programa.querySelector(".program-name").textContent,
        inicio: programa.dataset.start,
        fin: programa.dataset.end
      });

    });

  });

  localStorage.setItem(
    "veo_programacion_v3_" + canalActual,
    JSON.stringify(datos)
  );
}

function renderizarSemana(datos) {

  const contenedor = document.getElementById("week");

  contenedor.innerHTML = "";

  diaActual = obtenerDiaActual();

  dias.forEach(dia => {

    const bloque = document.createElement("div");

    bloque.className = "day";

    bloque.dataset.day = dia;

    if (dia === diaActual) {
      bloque.classList.add("open");
    }

    const boton = document.createElement("button");

    boton.className = "day-title";
    boton.textContent = dia;

    boton.onclick = function() {
      toggleDay(boton);
    };

    const contenido = document.createElement("div");

    contenido.className = "day-content";

    const programas = datos[dia] || [];

    programas.forEach(programa => {

      contenido.appendChild(
        crearPrograma(
          programa.nombre,
          programa.inicio,
          programa.fin
        )
      );

    });

    const botonAgregar = document.createElement("button");

    botonAgregar.className = "add";
    botonAgregar.textContent = "＋ Agregar programa";

    botonAgregar.onclick = function() {
      agregarPrograma(dia);
    };

    contenido.appendChild(botonAgregar);

    bloque.appendChild(boton);
    bloque.appendChild(contenido);

    contenedor.appendChild(bloque);

  });
}

function crearPrograma(nombre, inicio, fin) {

  const programa = document.createElement("div");

  programa.className = "program";

  programa.dataset.start = inicio;
  programa.dataset.end = fin;

  const tiempo = document.createElement("div");

  tiempo.className = "time";
  tiempo.textContent = inicio + " - " + fin;

  const nombrePrograma = document.createElement("div");

  nombrePrograma.className = "program-name";
  nombrePrograma.textContent = nombre;

  const editar = document.createElement("button");

  editar.className = "edit";
  editar.textContent = "Editar";

  editar.onclick = function() {
    editarPrograma(editar);
  };

  programa.appendChild(tiempo);
  programa.appendChild(nombrePrograma);
  programa.appendChild(editar);

  return programa;
}

function toggleDay(boton) {

  const dia = boton.parentElement;

  document.querySelectorAll(".day").forEach(otro => {

    if (otro !== dia) {
      otro.classList.remove("open");
    }

  });

  dia.classList.toggle("open");

  if (dia.classList.contains("open")) {
    diaActual = dia.dataset.day;
  }
}

function editarPrograma(boton) {

  const programa = boton.closest(".program");

  const nombre = programa.querySelector(".program-name").textContent;
  const horaInicio = programa.dataset.start;
  const horaFin = programa.dataset.end;

  const editor = document.createElement("div");

  editor.className = "program-editor";

  editor.innerHTML = `
    <div class="program-editor-box">

      <h2>Editar programa</h2>

      <label>Nombre del programa</label>
      <input class="editor-nombre" type="text">

      <label>Hora de inicio</label>
      <input class="editor-inicio" type="text" inputmode="numeric" placeholder="HH:MM">

      <label>Hora de término</label>
      <input class="editor-fin" type="text" inputmode="numeric" placeholder="HH:MM">

      <div class="editor-buttons">
        <button class="cancel-editor">Cancelar</button>
        <button class="save-editor">Guardar</button>
      </div>

    </div>
  `;

  document.body.appendChild(editor);

  editor.querySelector(".editor-nombre").value = nombre;
  editor.querySelector(".editor-inicio").value = horaInicio;
  editor.querySelector(".editor-fin").value = horaFin;

  editor.querySelector(".cancel-editor").onclick = function() {
    editor.remove();
  };

  editor.querySelector(".save-editor").onclick = function() {

    const nuevoNombre =
      editor.querySelector(".editor-nombre").value.trim();

    const nuevaHoraInicio =
      editor.querySelector(".editor-inicio").value;

    const nuevaHoraFin =
      editor.querySelector(".editor-fin").value;

    if (!nuevoNombre || !nuevaHoraInicio || !nuevaHoraFin) {
      alert("Completa todos los campos.");
      return;
    }

    programa.querySelector(".program-name").textContent =
      nuevoNombre;

    programa.querySelector(".time").textContent =
      nuevaHoraInicio + " - " + nuevaHoraFin;

    programa.dataset.start = nuevaHoraInicio;
    programa.dataset.end = nuevaHoraFin;

    guardarProgramacion();

    editor.remove();
  };
}

function agregarPrograma(dia) {

  const editor = document.createElement("div");

  editor.className = "program-editor";

  editor.innerHTML = `
    <div class="program-editor-box">

      <h2>Agregar programa</h2>

      <label>Nombre del programa</label>
      <input class="editor-nombre" type="text">

      <label>Hora de inicio</label>
      <input class="editor-inicio" type="text" inputmode="numeric" placeholder="HH:MM">

      <label>Hora de término</label>
      <input class="editor-fin" type="text" inputmode="numeric" placeholder="HH:MM">

      <div class="editor-buttons">
        <button class="cancel-editor">Cancelar</button>
        <button class="save-editor">Guardar</button>
      </div>

    </div>
  `;

  document.body.appendChild(editor);

  editor.querySelector(".cancel-editor").onclick = function() {
    editor.remove();
  };

  editor.querySelector(".save-editor").onclick = function() {

    const nuevoNombre =
      editor.querySelector(".editor-nombre").value.trim();

    const nuevaHoraInicio =
      editor.querySelector(".editor-inicio").value.trim();

    const nuevaHoraFin =
      editor.querySelector(".editor-fin").value.trim();

    if (!nuevoNombre || !nuevaHoraInicio || !nuevaHoraFin) {
      alert("Completa todos los campos.");
      return;
    }

    const bloqueDia = document.querySelector(
      '.day[data-day="' + dia + '"]'
    );

    const botonAgregar = bloqueDia.querySelector(".add");

    const nuevoPrograma = crearPrograma(
      nuevoNombre,
      nuevaHoraInicio,
      nuevaHoraFin
    );

    botonAgregar.parentElement.insertBefore(
      nuevoPrograma,
      botonAgregar
    );

    guardarProgramacion();

    editor.remove();
  };
}

const canalesGuardados = JSON.parse(
  localStorage.getItem("veo_canales") || "[]"
);

canalesGuardados.forEach(canal => {
  crearTarjetaCanal(
    canal.nombre,
    canal.id,
    canal.logo
  );
});

</script>

</body>
</html>
